name: Scan signals

on:
  schedule:
    # GitHub drops most of these ticks. Each run that does start holds the
    # runner and scans every 10 minutes; this cron is the handover trigger.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Pushes with GITHUB_TOKEN do not trigger pages.yml. Each published snapshot
# dispatches that workflow instead. The handover dispatch uses the same token
# (actions: write); no extra secret.
permissions:
  contents: write
  actions: write

# The next run waits here instead of cancelling a commit or push.
concurrency:
  group: signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Scan every 10 minutes
        run: bash pipeline/scan_loop.sh
        env:
          TRADING_ROOT: ${{ github.workspace }}
          TRADING_PIPELINE: ${{ github.workspace }}/pipeline
          TRADING_STATE: ${{ github.workspace }}/pipeline/state
          TRADING_DATA: ${{ github.workspace }}/data.json
          TRADING_RAW: /tmp/raw.pkl
          NTFY_URL: https://ntfy.sh/octa-signals-a6368a35
          SCAN_INTERVAL_SEC: "600"
          SCAN_BUDGET_SEC: "21000"
          SCAN_MAX_ITER_SEC: "540"
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
